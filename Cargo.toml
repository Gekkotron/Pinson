[package]
name = "Pinson"
version = "0.1.0"
edition = "2024"
authors = ["Gekkotron <60887050+Gekkotron@users.noreply.github.com>"]
license = "MIT"
description = "House music server: YouTube Music queue played through nidoo-sound"

[lib]
name = "pinson"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ytmapi-rs = { version = "0.3", features = ["simplified-queries"] }
rust-embed = "8"
mime_guess = "2"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
anyhow = "1"
futures-util = "0.3"
thiserror = "2"
reqwest = "0.13"
rand = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
rumqttc = { version = "0.25", default-features = false }
dotenvy = "0.15"
cpal = { version = "0.18", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
mdns-sd = "0.21"
roxmltree = "0.21.2"

[features]
default = ["local-audio"]
# This computer output: plays on the server's sound card.
local-audio = ["dep:cpal"]

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.28"
