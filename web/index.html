<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>Home Music</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="banner" class="banner" role="status" hidden>Reconnecting…</div>
<div class="app">
  <header class="bar">
    <div class="searchbox">
      <input id="search" type="search" placeholder="Search YouTube Music…" aria-label="Search YouTube Music" autocomplete="off" autocapitalize="off" enterkeyhint="search">
      <button id="clear" class="icon" type="button" aria-label="Clear search" hidden>✕</button>
    </div>
  </header>
  <main id="main" class="main">
    <div id="section" class="sec">Up next</div>
    <div id="list"></div>
  </main>
  <div id="mini" class="mini" hidden>
    <div id="mini-open" class="mini-open" role="button" tabindex="0" aria-label="Open now playing">
      <div id="mini-art" class="art"></div>
      <div class="grow"><div id="mini-title" class="t"></div><div id="mini-artist" class="s"></div></div>
    </div>
    <button id="mini-toggle" class="icon" type="button" aria-label="Pause">⏸</button>
    <button id="mini-skip" class="icon" type="button" aria-label="Next song">⏭</button>
  </div>
</div>

<section id="full" class="full" role="dialog" aria-modal="true" aria-label="Now playing" hidden>
  <button id="full-close" class="icon close" type="button" aria-label="Close">⌄</button>
  <div id="full-art" class="art big"></div>
  <div id="full-title" class="t big-t"></div>
  <div id="full-artist" class="s"></div>
  <div id="full-album" class="s dim"></div>
  <div class="prog"><i id="prog-fill"></i></div>
  <div class="times"><span id="t-cur">0:00</span><span id="t-tot">0:00</span></div>
  <div class="ctrl">
    <button id="full-prev" class="icon lg" type="button" aria-label="Previous song">⏮</button>
    <button id="full-toggle" class="icon lg hot" type="button" aria-label="Pause">⏸</button>
    <button id="full-skip" class="icon lg" type="button" aria-label="Next song">⏭</button>
  </div>
</section>

<div id="toast" class="toast" aria-live="polite"></div>
<script src="/app.js"></script>
</body>
</html>
